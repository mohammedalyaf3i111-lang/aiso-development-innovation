name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published pages
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "${{ steps.deployment.outputs.page_url }}"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "${{ steps.deployment.outputs.page_url }}en/"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "${{ steps.deployment.outputs.page_url }}ar/"
